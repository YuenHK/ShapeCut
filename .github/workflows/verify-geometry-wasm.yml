name: Verify deterministic geometry WASM regeneration

on:
  pull_request:
    paths:
      - "crates/geometry-wasm/**"
      - "scripts/build-geometry-wasm.mjs"
      - "scripts/verify-geometry-wasm-generated.mjs"
      - "scripts/verify-geometry-wasm-regeneration.mjs"
      - "src/wasm/generated/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/verify-geometry-wasm.yml"
      - "package.json"
      - "package-lock.json"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.98.0
          rustc --version
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Verify clean deterministic regeneration
        run: node scripts/verify-geometry-wasm-regeneration.mjs
