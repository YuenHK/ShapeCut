name: ShapeCut release gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release_gates:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Cache locked Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/geometry-wasm/target
          key: geometry-wasm-${{ runner.os }}-${{ hashFiles('crates/geometry-wasm/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.98.0
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test locked Rust kernel
        run: cargo test --locked --manifest-path crates/geometry-wasm/Cargo.toml
      - name: Build deterministic WASM
        run: npm run build:geometry-wasm
      - name: Verify tracked WASM
        run: npm run verify:geometry-wasm-generated
      - name: Type-check
        run: npm run typecheck
      - name: Serial Node tests
        run: npm test -- --maxWorkers=1 --fileParallelism=false
      - name: Browser differential tests
        run: npm run test:browser -- --run
      - name: Release verifier contract
        run: npm test -- src/test/wasm-geometry-release.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Regenerate committed release evidence without drift
        run: |
          npm exec vite-node -- scripts/generate-wasm-release-evidence.ts docs/validation/wasm-geometry-release-measurements.jsonl docs/validation/wasm-geometry-validation-evidence.json /tmp/wasm-geometry-release-evidence.json
          diff -u docs/validation/wasm-geometry-release-evidence.json /tmp/wasm-geometry-release-evidence.json
      - name: Verify committed blocked rollout evidence
        run: npm exec vite-node -- scripts/verify-wasm-geometry-release.ts docs/validation/wasm-geometry-release-evidence.json --expect-blocked
      - name: Production build and bundle inspection
        run: npm run build
      - name: Privacy scan release evidence
        run: '! rg -n -i "(?:/Users/|\\\\Users\\\\|@|knight|fortress|\.stl|sha256|sourceHash)" docs/validation/wasm-geometry-*.json docs/validation/wasm-geometry-*.jsonl'
